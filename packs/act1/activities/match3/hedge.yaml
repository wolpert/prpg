# A match-3 board. The filename's base is the activity id: the story plays it with
# `>>> play match3 hedge` and decides in Ink what winning means.
id: hedge
title: Clear the hedge
board:
  width: 6
  height: 6
  # Each piece is a bare name (palette swatch) or {name, color?, atlas?, region?} for real art.
  pieces: [bramble, leaf, thorn]
win:
  per_type:            # cleared-count target per piece type; all must be met
    bramble: 6
    leaf: 6
    thorn: 6

# The daemon is off on purpose: every ./gradlew spins up a fresh JVM, so commands feel slow, but no
# daemons pile up and hold RAM. Flip it if you prefer; nothing in the build depends on it.
org.gradle.daemon=false
org.gradle.jvmargs=-Xms512M -Xmx1G -Dfile.encoding=UTF-8 -Dconsole.encoding=UTF-8
# Must stay false: configure-on-demand breaks projects with Android modules.
org.gradle.configureondemand=false
# 'quiet' hides Gradle's own chatter; switch to 'lifecycle' to see task names (and build-scan links).
org.gradle.logging.level=quiet
android.useAndroidX=true
android.enableR8.fullMode=false
# Toggle the GraalVM native-image build path. When true, lwjgl3 applies nativeimage.gradle.kts and
# pulls in io.github.berstanio:gdx-svmhelper-* as well as the GraalVM native-image Gradle plugin.
enableGraalNative=false
